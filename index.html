<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ueno Mystery Walk</title>
  <style>
    body {
      background: linear-gradient(135deg, #006400, #00a86b, #7fff00);
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      text-align: center;
      min-height: 100vh;
      margin: 0;
      position: relative;
    }
    header {
      padding: 20px;
      font-size: 2em;
      font-weight: bold;
      position: relative;
      transition: color 0.5s ease;
    }
    .info-box {
      margin: 20px auto;
      width: 60%;
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 10px;
      position: relative;
    }
    h2 {
      margin-top: 10px;
    }
    p {
      font-size: 1.1em;
      line-height: 1.6em;
    }
    button {
      padding: 15px 30px;
      background: #00a86b;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.2em;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background: #ffd700;
      color: #000;
    }

    /* 透明ボタン共通 */
    .invisible-btn {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      opacity: 0;
    }
    #btnU {
      top: 25px;
      left: 20px;
      width: 40px;
      height: 40px;
    }
    #btnBoxEdge {
      top: 220px;
      right: 20px;
      width: 40px;
      height: 40px;
    }
    #btnBelowLocation {
      top: 600px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 40px;
    }
    #btnExtra {
      top: 860px;
      left: 100px;
      width: 60px;
      height: 60px;
    }

    .hidden-content {
      display: none;
      margin-top: 15px;
      font-size: 1.3em;
      font-weight: bold;
      color: #ffd700;
    }
    .hidden-image {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 10px;
      z-index: 2000;
      width: 500px;
      height: auto;
    }

    @keyframes flash {
      0% { opacity: 0; }
      50% { opacity: 0.5; background: rgba(255,255,255,0.5); }
      100% { opacity: 0; }
    }
    .flash {
      animation: flash 2s ease-in-out;
    }

    /* ▼▼ 追加：ヒントリンク ▼▼ */
    footer {
      margin-top: 60px;
      padding: 20px;
    }
    .hint-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      color: #ffd700;
      font-size: 1.2em;
      text-decoration: none;
    }
    .hint-link:hover {
      background: rgba(255,255,255,0.3);
    }
    /* ▲▲ 追加ここまで ▲▲ */

  </style>
</head>
<body>
  <header id="mainHeader">Ueno Mystery Walk</header>

  <div class="info-box">
    <h2>タイトル</h2>
    <p>上野公園謎解き~迷子のぽっけのお見送り~</p>

    <h2>概要</h2>
    <p>ぽっけが行きたいと思うところに連れて行ってあげよう<br>
       ぽっけと会話はできませんが、ぽっけの背中にスマホを当てることで<br>
       その場所が行きたい場所と気持ちを教えてくれます。<br>
       さあ最初の場所に連れて行ってあげて<br>
       game clear画面が出てきたら謎解き成功になります！</p>

    <button onclick="location.href='nazo1.html'">最初の場所への手がかり</button>

    <p id="textU" class="hidden-content">パスワードは謎2答えの頭文字</p>
    <p id="textBoxEdge" class="hidden-content">パスワードは謎3答えの頭文字</p>
    <img id="imgBelowLocation" class="hidden-image" src="images/OIP.jpg" alt="上野公園の写真">
    <p id="textExtra" class="hidden-content">パスワードは今日見た偉人の頭文字</p>
  </div>

  <!-- 透明ボタン -->
  <button id="btnU" class="invisible-btn" onclick="showContent('textU')"></button>
  <button id="btnBoxEdge" class="invisible-btn" onclick="showContent('textBoxEdge')"></button>
  <button id="btnBelowLocation" class="invisible-btn" onclick="showContent('imgBelowLocation')"></button>
  <button id="btnExtra" class="invisible-btn" onclick="showContent('textExtra')"></button>

  <!-- ▼▼ 追加：ヒントリンク ▼▼ -->
  <footer>
    <a href="hint.html" class="hint-link">ヒント</a>
  </footer>
  <!-- ▲▲ 追加ここまで ▲▲ -->

  <script>
    window.onload = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            document.getElementById("mainHeader").style.color = "red";
          },
          function(error) {
            document.getElementById("mainHeader").style.color = "yellow";
          }
        );
      } else {
        document.getElementById("mainHeader").style.color = "yellow";
      }
    };

    function showContent(id) {
      document.getElementById(id).style.display = 'block';
    }

    function flashButtons() {
      const buttons = document.querySelectorAll('.invisible-btn');
      buttons.forEach(btn => {
        btn.classList.add('flash');
        setTimeout(() => btn.classList.remove('flash'), 2000);
      });
    }
    setInterval(flashButtons, 30000);
  </script>
</body>
</html>
