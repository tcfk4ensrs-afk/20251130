<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>謎1 - Ueno Mystery Walk</title>
  <style>
    body {
      /* 緑系のグラデーション背景 */
      background: linear-gradient(135deg, #006400, #00a86b, #7fff00);
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      text-align: center;
      min-height: 100vh;
      margin: 0;
    }
    header {
      padding: 20px;
      font-size: 2em;
      font-weight: bold;
    }
    .content-box {
      margin: 20px auto;
      width: 80%;
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 10px;
    }
    h2 {
      margin-top: 10px;
      font-size: 1.8em;
    }
    img {
      width: 100%;
      max-width: 900px;
      border-radius: 10px;
      margin-top: 20px;
    }

    /* 回答フォーム */
    .answer-box {
      margin-top: 25px;
    }
    .answer-box input {
      width: 70%;
      padding: 10px;
      font-size: 1.2em;
      border-radius: 5px;
      border: none;
    }
    .answer-box button {
      padding: 10px 20px;
      font-size: 1.2em;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background-color: #ffd700;
      color: #000;
      cursor: pointer;
    }
    .answer-box button:hover {
      background-color: #ffea70;
    }
    #answerMessage {
      margin-top: 15px;
      font-size: 1.4em;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
    }
    footer a {
      color: #ffd700;
      font-size: 1.2em;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>Ueno Mystery Walk</header>

  <div class="content-box">
    <h2>謎1：上野公園の秘密</h2>
    <img src="images/1.jpg" alt="謎1のイメージ写真">

    <!-- 回答フォーム -->
    <div class="answer-box">
      <input type="text" id="answerInput" placeholder="答えを入力">
      <button id="submitAnswer">送信</button>
    </div>

    <p style="margin-top: 15px; font-size: 1.1em; color: #ffd700;">
      正解したら「上野　謎１の答え」で検索して次の目的地を特定しよう
    </p>

    <p id="answerMessage"></p>
  </div>

  <footer>
    <a href="index.html">◀ トップページへ戻る</a>
  </footer>

  <script>
    document.getElementById("submitAnswer").addEventListener("click", () => {
      const userAnswer = document.getElementById("answerInput").value.trim();
      const correctAnswers = ["ひこうせん", "ききゅう", "飛行船", "気球"];

      if (correctAnswers.includes(userAnswer)) {
        document.getElementById("answerMessage").textContent = "正解！";
        document.getElementById("answerMessage").style.color = "#00ff90";
      } else {
        document.getElementById("answerMessage").textContent = "違うよ。もう一度試してね。";
        document.getElementById("answerMessage").style.color = "#ff8080";
      }
    });
  </script>
</body>
</html>
